<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailbox Test</title>
    <style>
        body {
            font-family: monospace;
            background: #1e1e2e;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #111827;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #2d3748;
        }
        .token-display {
            background: #0a0e27;
            padding: 10px;
            border-radius: 6px;
            font-size: 11px;
            word-break: break-all;
            font-family: monospace;
            max-height: 150px;
            overflow-y: auto;
        }
        .error {
            color: #ef4444;
        }
        .success {
            color: #10b981;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        pre {
            background: #0a0e27;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 11px;
        }
        h3 { margin-bottom: 10px; color: #60a5fa; }
        hr { border-color: #2d3748; margin: 15px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>📧 Mailbox Troubleshooter</h1>
    
    <div class="card">
        <h3>📋 Session Info</h3>
        <div id="sessionInfo">Loading...</div>
    </div>
    
    <div class="card">
        <h3>🔑 Access Token</h3>
        <div id="tokenDisplay" class="token-display">Loading...</div>
        <button onclick="copyToken()">Copy Token</button>
        <button onclick="testGraphAPI()">Test Graph API</button>
    </div>
    
    <div class="card">
        <h3>📡 Graph API Test Results</h3>
        <div id="apiResult">Click "Test Graph API" to check permissions</div>
    </div>
    
    <div class="card">
        <h3>📧 Emails (Inbox)</h3>
        <div id="emails">Click "Test Graph API" first...</div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const userEmail = decodeURIComponent(urlParams.get('email') || '');
    const API_BASE = window.location.origin;
    
    let currentAccessToken = null;
    
    async function getToken() {
        try {
            const response = await fetch(`${API_BASE}/api/session/token/${encodeURIComponent(userEmail)}`);
            const data = await response.json();
            
            document.getElementById('sessionInfo').innerHTML = `
                <p><strong>Email:</strong> ${data.email || userEmail}</p>
                <p><strong>Has Refresh Token (PRT):</strong> ${data.has_refresh_token ? '✅ Yes' : '❌ No'}</p>
                <p><strong>Token Expires In:</strong> ${data.expires_in || 'Unknown'} seconds</p>
            `;
            
            if (data.access_token) {
                currentAccessToken = data.access_token;
                document.getElementById('tokenDisplay').innerHTML = currentAccessToken;
                return currentAccessToken;
            } else {
                document.getElementById('tokenDisplay').innerHTML = '<span class="error">No access token received</span>';
                return null;
            }
        } catch (err) {
            document.getElementById('sessionInfo').innerHTML = `<span class="error">Error: ${err.message}</span>`;
            return null;
        }
    }
    
    async function testGraphAPI() {
        if (!currentAccessToken) {
            await getToken();
        }
        
        if (!currentAccessToken) {
            document.getElementById('apiResult').innerHTML = '<span class="error">No token available</span>';
            return;
        }
        
        document.getElementById('apiResult').innerHTML = '<div class="spinner">Testing...</div>';
        
        // Test 1: Get User Profile
        try {
            const userResponse = await fetch('https://graph.microsoft.com/v1.0/me', {
                headers: { 'Authorization': `Bearer ${currentAccessToken}` }
            });
            const userData = await userResponse.json();
            
            if (userData.error) {
                document.getElementById('apiResult').innerHTML = `
                    <div class="error">
                        <strong>❌ Graph API Error:</strong><br>
                        Code: ${userData.error.code}<br>
                        Message: ${userData.error.message}<br>
                        <br>
                        <strong>Possible Fixes:</strong><br>
                        1. Go to Azure Portal → App registrations → Your app<br>
                        2. Add Mail.Read, Mail.ReadWrite, Mail.Send permissions<br>
                        3. Click "Grant admin consent"<br>
                        4. Re-authenticate the user
                    </div>
                `;
                return;
            }
            
            document.getElementById('apiResult').innerHTML = `
                <div class="success">
                    <strong>✅ User Profile Retrieved:</strong><br>
                    Name: ${userData.displayName}<br>
                    Email: ${userData.mail || userData.userPrincipalName}<br>
                    ID: ${userData.id}
                </div>
            `;
        } catch (err) {
            document.getElementById('apiResult').innerHTML = `<span class="error">Network error: ${err.message}</span>`;
            return;
        }
        
        // Test 2: Get Emails (Inbox)
        try {
            const emailsResponse = await fetch('https://graph.microsoft.com/v1.0/me/mailFolders/inbox/messages?$top=10', {
                headers: { 'Authorization': `Bearer ${currentAccessToken}` }
            });
            const emailsData = await emailsResponse.json();
            
            if (emailsData.error) {
                document.getElementById('emails').innerHTML = `
                    <div class="error">
                        <strong>❌ Cannot fetch emails:</strong><br>
                        ${emailsData.error.message}
                    </div>
                `;
                return;
            }
            
            const emails = emailsData.value || [];
            if (emails.length === 0) {
                document.getElementById('emails').innerHTML = '<div>📭 No emails in inbox</div>';
            } else {
                document.getElementById('emails').innerHTML = emails.map(email => `
                    <div style="border-bottom: 1px solid #2d3748; padding: 10px 0;">
                        <strong>${escapeHtml(email.subject || '(No subject)')}</strong><br>
                        From: ${escapeHtml(email.from?.emailAddress?.name || email.from?.emailAddress?.address)}<br>
                        Received: ${new Date(email.receivedDateTime).toLocaleString()}<br>
                        <small>${escapeHtml(email.bodyPreview?.substring(0, 100) || '')}...</small>
                    </div>
                `).join('');
            }
        } catch (err) {
            document.getElementById('emails').innerHTML = `<span class="error">Error: ${err.message}</span>`;
        }
    }
    
    function copyToken() {
        if (currentAccessToken) {
            navigator.clipboard.writeText(currentAccessToken);
            alert('Token copied!');
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }
    
    getToken();
</script>
</body>
</html>
